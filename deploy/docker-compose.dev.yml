# Local development database. Run from the repo root:
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Port 5433 so it doesn't clash with a locally installed Postgres.
name: zarqa-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: zarqa
      POSTGRES_USER: zarqa
      POSTGRES_PASSWORD: zarqa-dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarqa -d zarqa"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
