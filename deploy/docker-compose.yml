# Production stack on the VPS. Secrets come from deploy/.env (never committed):
#   POSTGRES_PASSWORD=...
#   ZARQA_DOMAIN=zarqa.example.com
#   EMAIL_PROVIDER=resend            (optional; default "log")
#   RESEND_API_KEY=re_...            (set with deploy/set-secret.sh, never typed into chat)
#   EMAIL_FROM=Zarqa <hello@zarqa.example.com>
# Run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: zarqa

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Zarqa: Host=postgres;Database=zarqa;Username=zarqa;Password=${POSTGRES_PASSWORD}
      # Sign-in emails: "log" (codes in the server log) until a Resend key and verified sender are set.
      Email__Provider: ${EMAIL_PROVIDER:-log}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Email__From: ${EMAIL_FROM:-}
      # TEST ONLY: shows the sign-in code in the app (anyone can sign in as anyone). Off for real users.
      Auth__TestMode: ${AUTH_TEST_MODE:-false}
      # Matching models (secrets: set with deploy/set-secret.*). No keys = matching waits, nothing breaks.
      Models__OpenAiApiKey: ${OPENAI_API_KEY:-}
      Models__OpenAiBaseUrl: ${OPENAI_BASE_URL:-}
      Models__LunaBaseUrl: ${LUNA_BASE_URL:-}
      Models__OpenRouterApiKey: ${OPENROUTER_API_KEY:-}
      Models__TypeSafeApiKey: ${TYPESAFE_API_KEY:-}
      Models__DailySpendCapUsd: ${MODEL_DAILY_CAP_USD:-2}
      Matching__Worker: ${MATCHING_ENABLED:-true}
      # Comma-separated admin emails (Profile shows an Admin link for them).
      Admin__Emails: ${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - photos:/app/data/photos

  # Private inference gateway: no published ports, no API keys or app data mounts.
  # Authentication is owned/refreshed by the official Codex CLI in its own volume.
  codex:
    build:
      context: ..
      dockerfile: deploy/codex/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      CODEX_HOME: /home/node/.codex
    volumes:
      - codex_auth:/home/node/.codex
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: zarqa
      POSTGRES_USER: zarqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarqa -d zarqa"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZARQA_DOMAIN: ${ZARQA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  codex_auth:
  pgdata:
  photos:
  caddy_data:
  caddy_config:
