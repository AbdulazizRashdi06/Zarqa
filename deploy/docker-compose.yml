# Production stack on the VPS. Secrets come from deploy/.env (never committed):
#   POSTGRES_PASSWORD=...
#   ZARQA_DOMAIN=zarqa.example.com
# Run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: zarqa

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Zarqa: Host=postgres;Database=zarqa;Username=zarqa;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - photos:/app/data/photos

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: zarqa
      POSTGRES_USER: zarqa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zarqa -d zarqa"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZARQA_DOMAIN: ${ZARQA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  photos:
  caddy_data:
  caddy_config:
