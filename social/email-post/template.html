<!doctype html>
<!--
  Instagram post: a letter from Zarqa to a student who made a lost report.
  1080 × 1350 (4:5). Everything that changes per post comes from posts.json (see README.md);
  render.mjs fills it in and saves a PNG. Open this file in a browser to see the defaults.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zarqa letter post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@900&family=Caveat:wght@700&display=block" rel="stylesheet">
<style>
  @font-face { font-family: 'Anton'; font-weight: 400; font-display: block;
    src: url('../../web/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Figtree'; font-weight: 500; font-display: block;
    src: url('../../web/node_modules/@fontsource/figtree/files/figtree-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Figtree'; font-weight: 800; font-display: block;
    src: url('../../web/node_modules/@fontsource/figtree/files/figtree-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; font-display: block;
    src: url('../../web/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2') format('woff2'); }

  :root {
    --ground: #222634; --paper: #f2eee8; --paper-line: #cfc6ba;
    --tan: #bd9777; --tan-dark: #8a6a4f; --sage: #8e9da0;
    --ink: #222634; --ink-muted: #5e6472; --text-muted: #a9b4b6;
    --accent: var(--tan); --accent-ink: var(--tan-dark);
    --display: 'Anton', Impact, sans-serif;
    --sans: 'Figtree', Arial, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --hand: 'Caveat', 'Segoe Print', cursive;
    --arabic: 'Alexandria', 'Segoe UI', sans-serif;
  }
  .found { --accent: var(--sage); --accent-ink: var(--ink-muted); }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--ground); }
  body { width: 1080px; height: 1350px; overflow: hidden; }

  .post {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: var(--ground); color: var(--paper); font-family: var(--sans);
  }

  /* ---------- top left: wordmark and heading ---------- */
  .wordmark { position: absolute; top: 60px; left: 64px; font-family: var(--display); font-size: 56px; letter-spacing: 2px; line-height: 1; }
  .wordmark span { color: var(--tan); }
  .hero { position: absolute; left: 64px; top: 150px; width: 520px; z-index: 3; }
  .sticker {
    display: inline-block; rotate: -5deg; background: var(--accent); color: var(--ground);
    font-family: var(--mono); font-weight: 700; font-size: 22px; letter-spacing: 3px;
    padding: 12px 20px; border-radius: 999px; margin-bottom: 20px;
  }
  .sticker:empty { display: none; }
  .arabic {
    font-family: var(--arabic); font-weight: 900; font-size: var(--as, 64px); line-height: 1.2;
    color: var(--accent); direction: rtl; text-align: left; unicode-bidi: plaintext; margin-bottom: 4px;
  }
  .arabic:empty { display: none; }
  .heading {
    font-family: var(--display); font-size: var(--hs, 92px); line-height: 0.94; letter-spacing: 1px;
    text-transform: uppercase; color: var(--paper);
  }
  .heading em { font-style: normal; color: var(--accent); }

  /* ---------- the place for Zarqa ----------
     A box on the top right whose bottom sits behind the letter, so she looks like
     she's peeking over it. The picture fits inside, anchored to the bottom.
     Nudge per post with mascot.scale / x / y / flip in posts.json. */
  .zarqa-slot {
    position: absolute; right: 64px; top: 40px; width: 480px; height: 560px; z-index: 1;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .zarqa-slot img {
    max-width: 100%; max-height: 100%; object-fit: contain; object-position: bottom center;
    transform-origin: bottom center;
    translate: var(--mx, 0px) var(--my, 0px); scale: var(--ms, 1);
  }
  .zarqa-slot.flip img { transform: scaleX(-1); }
  .zarqa-slot.empty { border: 4px dashed #4a5263; border-radius: 40px; align-items: center; }
  .zarqa-slot.empty::after { content: 'ZARQA GOES HERE'; font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: 3px; color: #6b7487; }

  /* ---------- the letter ---------- */
  .letter {
    position: absolute; left: 56px; right: 56px; bottom: 104px; z-index: 2;
    rotate: -1.2deg;
    background:
      linear-gradient(to bottom, transparent 38%, rgba(34,38,52,.07) 38.2%, transparent 39.2%),
      var(--paper);
    color: var(--ink); border-radius: 6px;
    padding: 44px 56px 40px;
    box-shadow: 0 24px 50px rgba(0,0,0,.35);
  }
  .letterhead {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: 3px; color: var(--accent-ink);
    padding-bottom: 18px; border-bottom: 3px solid var(--paper-line);
  }
  .greeting { font-family: var(--hand); font-weight: 700; font-size: 84px; line-height: 1; margin-top: 30px; }
  .para { font-weight: 500; font-size: 31px; line-height: 1.42; margin-top: 18px; }
  .ticket-label { margin-top: 26px; font-family: var(--mono); font-weight: 700; font-size: 20px; letter-spacing: 3px; color: var(--accent-ink); }
  .tag {
    margin-top: 12px; display: flex; align-items: center; background: var(--accent); color: var(--ink);
    border-radius: 28px 8px 8px 28px;
    clip-path: polygon(30px 0, 100% 0, 100% 100%, 30px 100%, 0 calc(100% - 30px), 0 30px);
  }
  .tag .hole { width: 22px; height: 22px; border-radius: 50%; background: var(--paper); margin: 0 22px 0 32px; flex: none; }
  .tag .item { padding: 20px 28px 20px 0; font-weight: 800; font-size: 33px; line-height: 1.25; }

  .close { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 28px; }
  .stamp {
    width: 150px; height: 150px; border-radius: 50%; flex: none; rotate: -14deg;
    border: 4px solid var(--accent-ink); outline: 2px solid var(--accent-ink); outline-offset: -14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-family: var(--mono); font-weight: 700; color: var(--accent-ink); opacity: .75; text-align: center;
  }
  .stamp .big { font-size: 22px; letter-spacing: 2px; }
  .stamp .small { font-size: 14px; letter-spacing: 2px; }
  .sign-off { text-align: right; }
  .sign-off .bye { font-weight: 500; font-size: 30px; line-height: 1.3; }
  .sign-off .name { font-family: var(--hand); font-weight: 700; font-size: 96px; line-height: .95; color: var(--accent-ink); }
  .sign-off .role:empty { display: none; }
  .sign-off .role { font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: 2px; color: var(--ink-muted); margin-top: 6px; }

  /* ---------- bottom line ---------- */
  .foot {
    position: absolute; left: 64px; right: 64px; bottom: 42px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: 2px; color: var(--text-muted);
  }
  .foot b { color: var(--paper); font-weight: 700; letter-spacing: 0; }
  /* ---------- empty parts disappear, so a post can leave them out ---------- */
  .para:empty, .ticket-label:empty, .sign-off .bye:empty, .letterhead span:empty { display: none; }
  .tag.none { display: none; }
  .stamp.none { visibility: hidden; }

  /* ---------- bigBody: the paragraph under the tag becomes the punchline ---------- */
  .big-body .para.body { text-wrap: balance; font-weight: 800; font-size: var(--bs, 46px); line-height: 1.18; margin-top: 24px; }

  /* ---------- shape: "square" (1080 x 1080, for carousels) ----------
     The letter has a fixed top edge here, so Zarqa, the tag and the signature
     sit in the same place on every slide. */
  .post.square { height: 1080px; }
  .square .wordmark { top: 46px; left: 56px; font-size: 48px; }
  .square .hero { left: 56px; top: 116px; width: 500px; }
  .square .heading { font-size: var(--hs, 78px); }
  .square .zarqa-slot { right: 56px; top: 22px; width: 450px; height: 440px; }
  .square .letter { left: 48px; right: 48px; top: 368px; bottom: 82px; padding: 32px 48px 28px; display: flex; flex-direction: column; }
  .square .letterhead { font-size: 18px; padding-bottom: 14px; }
  .square .greeting { font-size: 72px; margin-top: 22px; }
  .square .tag { margin-top: 18px; }
  .square .tag .item { font-size: 40px; padding: 15px 28px 15px 0; }
  .square .letter { background: var(--paper); }
  .square.big-body .para.body { flex: 1; display: flex; align-items: center; margin-top: 0; padding: 6px 0; }
  .square .close { margin-top: 0; }
  .square .stamp { width: 128px; height: 128px; outline-offset: -12px; }
  .square .stamp .big { font-size: 18px; letter-spacing: 1px; line-height: 1.05; max-width: 96px; }
  .square .stamp .small { font-size: 12px; }
  .square .sign-off .name { font-size: 88px; }
  .square .foot { left: 56px; bottom: 28px; font-size: 22px; }
  /* ---------- layout: "cover" (the first page of a carousel) ----------
     No letter: a huge heading, Zarqa large on the right, and a sealed envelope
     addressed in her handwriting. Meant for shape "square". */
  .envelope, .swipe { display: none; }
  .cover .letter { display: none; }
  .cover .hero { top: 132px; width: 620px; }
  .cover .heading { font-size: var(--hs, 168px); line-height: 0.92; }
  .cover .zarqa-slot { right: -8px; top: 36px; width: 700px; height: 1070px; z-index: 1; }
  .cover .envelope {
    display: block; position: absolute; left: 56px; bottom: 96px; width: 640px; height: 300px; z-index: 2;
    rotate: -4deg; border-radius: 8px; color: var(--ink); padding: 0 44px;
    background:
      linear-gradient(to bottom right, transparent calc(50% - 3px), var(--paper-line) calc(50% - 3px), var(--paper-line) 50%, transparent 50%) left top / 50% 38% no-repeat,
      linear-gradient(to bottom left, transparent calc(50% - 3px), var(--paper-line) calc(50% - 3px), var(--paper-line) 50%, transparent 50%) right top / 50% 38% no-repeat,
      var(--paper);
    box-shadow: 0 24px 50px rgba(0,0,0,.4);
  }
  .envelope .seal {
    position: absolute; left: 50%; top: 38%; translate: -50% -50%; width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); color: var(--ground); display: flex; align-items: center; justify-content: center;
    font-size: 34px; line-height: 1; box-shadow: 0 3px 0 var(--accent-ink);
  }
  .envelope .to { position: absolute; left: 44px; right: 44px; bottom: 26px; }
  .envelope .to .hand { font-family: var(--hand); font-weight: 700; font-size: 76px; line-height: 1; }
  .envelope .to .line { font-weight: 800; font-size: 34px; line-height: 1.2; margin-top: 6px; }
  .envelope .to .line:empty { display: none; }
  .cover .swipe {
    display: block; position: absolute; right: 56px; bottom: 22px; z-index: 3;
    background: var(--accent); color: var(--ground); border-radius: 999px; padding: 12px 22px;
    font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: 3px;
  }
  .cover .swipe:empty { display: none; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="wordmark">ZARQA <span>&#9673;</span></div>

  <div class="hero">
    <div class="sticker" data-f="sticker"></div>
    <div class="arabic" lang="ar" data-f="arabic"></div>
    <div class="heading" id="heading"></div>
  </div>

  <div class="zarqa-slot" id="slot"><img id="zarqa" src="../../design/mascot/email-spotted.png" alt="Zarqa"></div>

  <div class="letter">
    <div class="letterhead"><span data-f="from"></span><span data-f="date"></span></div>
    <div class="greeting" data-f="greeting"></div>
    <div class="para" data-f="opening"></div>
    <div class="ticket-label" data-f="ticketLabel"></div>
    <div class="tag" id="tag"><div class="hole"></div><div class="item" id="item"></div></div>
    <div class="para body" data-f="body"></div>
    <div class="close">
      <div class="stamp" id="stamp"><span class="small" data-f="stampTop"></span><span class="big" data-f="stamp"></span><span class="small" data-f="stampBottom"></span></div>
      <div class="sign-off">
        <div class="bye" data-f="signOff"></div>
        <div class="name" data-f="signature"></div>
        <div class="role" data-f="role"></div>
      </div>
    </div>
  </div>

  <div class="envelope">
    <div class="seal">&#9673;</div>
    <div class="to"><div class="hand" data-f="coverHand"></div><div class="line" data-f="coverLine"></div></div>
  </div>
  <div class="swipe" data-f="swipe"></div>

  <div class="foot"><span><b>tryzarqa.com</b></span></div>
</div>

<script>
  // Defaults: the "Zarqa spotted a possible match" email (server/Zarqa.Api/Notifications/Notifier.cs), as a letter.
  const DEFAULTS = {
    layout: 'letter',       // 'letter', or 'cover' for the first page of a carousel
    coverHand: 'Dear student,',   // cover: handwriting on the envelope
    coverLine: '',                // cover: bold line under it
    swipe: 'SWIPE →',          // cover: the pill at the bottom right
    shape: 'portrait',      // 'portrait' = 1080 x 1350, 'square' = 1080 x 1080
    found: false,
    sticker: 'YOU GOT MAIL',
    arabic: '',
    heading: 'A letter|from [Zarqa]',
    headingSize: 92,
    arabicSize: 64,
    from: 'GUTECH LOST & FOUND',
    date: '25 NOV 2026',
    greeting: 'Dear student,',
    opening: 'I think I spotted something that might be yours.',
    ticketLabel: 'YOUR LOST REPORT',
    item: 'Black AirPods case with a moon sticker',
    itemQuotes: true,       // false: show the tag text as written, without quote marks
    bigBody: false,         // true: the paragraph under the tag is set large and bold
    bodySize: 46,           // px, used when bigBody is true
    body: 'Someone found it on campus. Open Zarqa and check the match: if it’s yours, you can message the finder right away.',
    stampTop: 'GUTECH',
    stamp: 'SPOTTED',
    stampBottom: 'HALBAN',
    signOff: 'Keeping an eye out for you,',
    signature: 'Zarqa',
    role: '',
    mascot: { src: '../../design/mascot/email-spotted.png', scale: 1, x: 0, y: 0, flip: false },
  };

  function fill(p) {
    p = { ...DEFAULTS, ...p, mascot: { ...DEFAULTS.mascot, ...(p.mascot || {}) } };
    const post = document.getElementById('post');
    post.classList.toggle('found', !!p.found);
    post.classList.toggle('square', p.shape === 'square');
    post.classList.toggle('cover', p.layout === 'cover');
    post.classList.toggle('big-body', !!p.bigBody);
    post.style.setProperty('--bs', p.bodySize + 'px');
    for (const el of document.querySelectorAll('[data-f]')) el.textContent = p[el.dataset.f] ?? '';

    // [word] takes the accent colour; | forces a line break.
    const h = document.getElementById('heading');
    h.innerHTML = '';
    for (const part of p.heading.split(/(\[[^\]]*\]|\|)/)) {
      if (part === '|') h.append(document.createElement('br'));
      else if (part.startsWith('[')) { const em = document.createElement('em'); em.textContent = part.slice(1, -1); h.append(em); }
      else h.append(part);
    }
    h.style.setProperty('--hs', p.headingSize + 'px');
    document.querySelector('.arabic').style.setProperty('--as', p.arabicSize + 'px');

    document.getElementById('item').textContent = p.itemQuotes ? '“' + p.item + '”' : p.item;
    document.getElementById('tag').classList.toggle('none', !p.item);
    document.getElementById('stamp').classList.toggle('none', !p.stamp);

    const slot = document.getElementById('slot'), img = document.getElementById('zarqa');
    const m = p.mascot;
    slot.classList.toggle('empty', !m.src);
    slot.classList.toggle('flip', !!m.flip);
    img.hidden = !m.src;
    if (m.src) img.src = m.src;
    img.style.setProperty('--ms', m.scale);
    img.style.setProperty('--mx', m.x + 'px');
    img.style.setProperty('--my', m.y + 'px');
  }

  // render.mjs sets window.POST before the page loads; a browser preview can pass ?mascot=path.
  const q = new URLSearchParams(location.search);
  fill(window.POST || (q.get('mascot') !== null ? { mascot: { src: q.get('mascot') } } : {}));
</script>
</body>
</html>
