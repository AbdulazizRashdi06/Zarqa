</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #222634; color: #F2EEE8; font-family: 'Figtree', system-ui, sans-serif; box-sizing: border-box; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 14px">

</a>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #A9B4B6">ZARQA SPOTTED THIS · 11:40</span>

<div aria-hidden="true" style="position: absolute; top: 66px; right: 14px; width: 128px; display: flex; flex-direction: column; align-items: center">
<span style="transform: rotate(6deg); background: #BD9777; color: #222634; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; padding: 5px 9px; border-radius: 999px; margin-bottom: -6px; position: relative; z-index: 1">SPOTTED IT</span>

<div style="position: relative; height: 232px; flex-shrink: 0">
<div style="position: absolute; left: -4px; top: 14px; width: 210px; height: 170px; transform: rotate(-6deg); background: #F2EEE8; color: #222634; clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 calc(100% - 20px), 0 20px); padding: 16px 14px 14px 38px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<span style="position: absolute; left: 13px; top: 79px; width: 12px; height: 12px; border-radius: 6px; background: #222634"></span>

<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#222634" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="5"></rect><path d="M4 12h16"></path><path d="M11 14.5h2"></path></svg>
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 24px; line-height: 1; text-transform: uppercase">AirPods Pro case</span>

<div style="position: absolute; right: -4px; top: 52px; width: 200px; height: 170px; transform: rotate(5deg); background: #BD9777; color: #222634; clip-path: polygon(20px 0, 100% 0, 100% 100%, 20px 100%, 0 calc(100% - 20px), 0 20px); padding: 16px 14px 14px 38px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<span style="position: absolute; left: 13px; top: 79px; width: 12px; height: 12px; border-radius: 6px; background: #222634"></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px">SOMEONE FOUND</span>

<span style="font-family: 'Anton', Impact, sans-serif; font-size: 24px; line-height: 1; text-transform: uppercase">White earbuds case</span>
<span style="font-size: 12px; font-weight: 700">Library study area · 11:40</span>

<div aria-hidden="true" style="position: absolute; left: 120px; top: 150px; width: 92px; height: 92px; border-radius: 46px; background: #222634; border: 3px solid #F2EEE8; transform: rotate(-14deg); display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; color: #F2EEE8">

<span style="font-family: 'Anton', Impact, sans-serif; font-size: 24px; line-height: 1">MATCH</span>

</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 14px; padding: 9px 0; border-top: 1px solid #3A4152; font-size: 15px; font-weight: 600; line-height: 1.3">
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 22px; color: #BD9777; width: 28px; flex-shrink: 0">{{r.n}}</span>
{{r.text}}
</div>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 22px; background: #222634; display: flex; flex-direction: column; gap: 4px">
<a href="Chat.dc.html" style="height: 66px; border-radius: 16px; background: #BD9777; color: #222634; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 22px; text-decoration: none">
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 25px; letter-spacing: 0.5px">IT'S MINE. MESSAGE THEM</span>
<span style="width: 46px; height: 46px; border-radius: 23px; background: #222634; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#BD9777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</span>

<a href="Main.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; text-decoration: none">Not mine, keep looking</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var texts = [
      'Same kind of item: earbuds case',
      'Found in the same building',
      'Found about 1.5 hours later',
      'Both mention a sticker on the back'
    ];
    return {
      reasons: texts.map(function (t, i) { return { text: t, n: '0' + (i + 1) }; })
    };
  }
}
</script>
</body>
</html>
