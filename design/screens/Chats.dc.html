<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zarqa — Chats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #222634; color: #F2EEE8; font-family: 'Figtree', system-ui, sans-serif; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 22px; background: #2E3343; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2EEE8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #A9B4B6">2 UNREAD</span>
</header>

<h1 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 64px; line-height: 0.92; text-transform: uppercase">Chats</h1>

<div style="display: flex; flex-direction: column">
<sc-for list="{{chats}}" as="c" hint-placeholder-count="3">
<a href="{{c.href}}" style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #3A4152; color: #F2EEE8; text-decoration: none; opacity: {{c.opacity}}">
<span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: {{c.avatarBg}}; color: #222634; font-family: 'Anton', Impact, sans-serif; font-size: 22px; display: flex; align-items: center; justify-content: center">{{c.initial}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 20px; line-height: 1; text-transform: uppercase">{{c.name}}</span>
<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A4A7">{{c.time}}</span>
</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: #BD9777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.item}}</span>
<span style="display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1; min-width: 0; font-size: 14px; font-weight: {{c.weight}}; color: {{c.msgColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</span>
<sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 22px; height: 22px; border-radius: 11px; background: #BD9777; color: #222634; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{c.unread}}</span>
</sc-if>
</span>
</span>
</a>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; align-items: flex-end; gap: 8px">
<img src="../mascot/reading.png" alt="Zarqa" style="width: 70px; height: auto; flex-shrink: 0">
<div style="background: #2E3343; border-radius: 16px 16px 16px 4px; padding: 11px 14px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #BD9777">ZARQA</span>
<span style="font-size: 13px; line-height: 1.4; color: #C3CBCC">Hand things over on campus, somewhere public. Ask a question only the owner would know.</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { name: 'Maryam', initial: 'M', item: 'AIRPODS PRO CASE · YOU LOST', last: 'That is the one. I am on campus until 3. Library entrance?', time: '11:55', unread: 1, href: 'Chat.dc.html', avatarBg: '#8E9DA0', closed: false },
      { name: 'Omar', initial: 'O', item: 'STUDENT ID CARD · YOU FOUND', last: 'Can I pick it up at the cafeteria after my 1pm class?', time: '10:02', unread: 1, href: 'Chat.dc.html', avatarBg: '#BD9777', closed: false },
      { name: 'Khalid', initial: 'K', item: 'CASIO FX-991 · RETURNED', last: 'Got it, thanks a lot!', time: '18 Sep', unread: 0, href: '#', avatarBg: '#434E5F', closed: true }
    ];
    return {
      chats: raw.map(function (c) {
        return Object.assign({}, c, {
          hasUnread: c.unread > 0,
          weight: c.unread > 0 ? 700 : 500,
          msgColor: c.unread > 0 ? '#F2EEE8' : '#A9B4B6',
          opacity: c.closed ? 0.6 : 1
        });
      })
    };
  }
}
</script>
</body>
</html>
