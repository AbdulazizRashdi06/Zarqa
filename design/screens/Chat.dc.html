<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zarqa — Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E3C4A8}a:hover{color:#F2EEE8}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #222634; color: #F2EEE8; font-family: 'Figtree', system-ui, sans-serif; box-sizing: border-box; display: flex; flex-direction: column">

<div style="background: #2E3343; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px; border-radius: 0 0 24px 24px">
<header style="display: flex; align-items: center; gap: 10px">
<a href="Match.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #222634; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2EEE8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: #8E9DA0; color: #222634; font-family: 'Anton', Impact, sans-serif; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">M</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 22px; line-height: 1; text-transform: uppercase">Maryam</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #A9B4B6">FOUND YOUR ITEM</span>
</div>
</header>
<div style="display: flex; align-items: center; gap: 10px">
<div style="position: relative; flex-grow: 1; min-width: 0; height: 44px; background: #BD9777; color: #222634; clip-path: polygon(14px 0, 100% 0, 100% 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); padding: 0 12px 0 30px; display: flex; align-items: center; gap: 8px; box-sizing: border-box">
<span style="position: absolute; left: 10px; top: 17px; width: 10px; height: 10px; border-radius: 5px; background: #2E3343"></span>
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">AIRPODS PRO CASE</span>
<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px">CHATTING</span>
</div>
<button type="button" onClick="{{markReturned}}" style="font-family: inherit; flex-shrink: 0; height: 44px; padding: 0 12px; border-radius: 12px; border: 2px solid #F2EEE8; background: transparent; color: #F2EEE8; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 5px; cursor: pointer">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F2EEE8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
Got it back</button>
</div>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="5">
<sc-if value="{{m.isSystem}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-end; gap: 8px; margin-bottom: 4px">
<img src="../mascot/reading.png" alt="Zarqa" style="width: 52px; height: auto; flex-shrink: 0">
<div style="background: #2E3343; border-radius: 16px 16px 16px 4px; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; max-width: 260px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #BD9777">ZARQA</span>
<span style="font-size: 13px; line-height: 1.4; color: #C3CBCC">{{m.text}}</span>
</div>
</div>
</sc-if>
<sc-if value="{{m.isThem}}" hint-placeholder-val="{{ true }}">
<div style="align-self: flex-start; max-width: 272px; display: flex; flex-direction: column; gap: 4px">
<div style="background: #F2EEE8; color: #222634; border-radius: 20px 20px 20px 4px; padding: 11px 14px; font-size: 15px; font-weight: 500; line-height: 1.4">{{m.text}}</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #98A4A7; padding-left: 4px">{{m.time}}</span>
</div>
</sc-if>
<sc-if value="{{m.isMe}}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-end; max-width: 272px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<div style="background: #BD9777; color: #222634; border-radius: 20px 20px 4px 20px; padding: 11px 14px; font-size: 15px; font-weight: 600; line-height: 1.4">{{m.text}}</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #98A4A7; padding-right: 4px">{{m.time}}</span>
</div>
</sc-if>
<sc-if value="{{m.isMeet}}" hint-placeholder-val="{{ false }}">
<div style="align-self: flex-start; width: 286px; background: #F2EEE8; color: #222634; border-radius: 20px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #8A6A4F">HANDOVER · SUGGESTED</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 46px; line-height: 0.95">{{m.time}}</span>
<span style="font-size: 14px; font-weight: 700">{{m.when}}</span>
</div>
<div aria-hidden="true" style="position: relative; height: 0; border-top: 2px dashed #CFC6BA; margin: 4px -16px">
<span style="position: absolute; left: -11px; top: -12px; width: 22px; height: 22px; border-radius: 11px; background: #222634"></span>
<span style="position: absolute; right: -11px; top: -12px; width: 22px; height: 22px; border-radius: 11px; background: #222634"></span>
</div>
<sc-if value="{{m.pending}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{m.confirm}}" style="font-family: 'Anton', Impact, sans-serif; min-height: 46px; border: none; border-radius: 12px; background: #222634; color: #F2EEE8; font-size: 18px; letter-spacing: 0.5px; cursor: pointer">CONFIRM</button>
<button type="button" style="font-family: inherit; min-height: 46px; border: 2px solid #222634; border-radius: 12px; background: transparent; color: #222634; font-size: 14px; font-weight: 700; cursor: pointer">Suggest another</button>
</div>
</sc-if>
<sc-if value="{{m.confirmed}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; min-height: 46px; border-radius: 12px; background: #222634; color: #F2EEE8; font-size: 14px; font-weight: 700; padding: 0 14px">
<img src="../mascot/wink.png" alt="Zarqa winking" style="width: 34px; height: auto; margin: -4px 0">
Confirmed. See you there.</div>
</sc-if>
</div>
</sc-if>
</sc-for>
</div>

<div style="background: #2E3343; padding: 12px 16px 24px; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{quick}}" as="qk" hint-placeholder-count="3">
<button type="button" onClick="{{qk.send}}" style="font-family: inherit; flex-shrink: 0; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #8E9DA0; background: transparent; color: #F2EEE8; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap">{{qk.label}}</button>
</sc-for>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<label for="chat-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
<input id="chat-input" type="text" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" placeholder="Message Maryam" style="font-family: inherit; flex-grow: 1; min-width: 0; height: 50px; border-radius: 25px; border: none; background: #222634; padding: 0 18px; font-size: 16px; color: #F2EEE8; box-sizing: border-box">
<button type="button" aria-label="Send" onClick="{{onSend}}" style="width: 50px; height: 50px; flex-shrink: 0; border-radius: 25px; border: none; background: #BD9777; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222634" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</div>
</div>

<sc-if value="{{returned}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Item returned" style="position: absolute; inset: 0; background: rgba(34,38,52,0.95); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 24px 20px 28px; box-sizing: border-box; gap: 12px; text-align: center">
<img src="../mascot/phone.png" alt="Zarqa holding up a returned phone" style="width: 228px; height: auto; margin-bottom: -4px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #A9B4B6">AIRPODS PRO CASE</span>
<h2 style="margin: 0; font-family: 'Anton', Impact, sans-serif; font-weight: 400; font-size: 80px; line-height: 0.9; color: #BD9777">RETURNED.</h2>
<p style="margin: 0 0 8px; font-size: 16px; line-height: 1.45; color: #C3CBCC; max-width: 300px">Back where it belongs. Zarqa saw this coming three days ago.</p>
<a href="Main.dc.html" style="align-self: stretch; height: 66px; border-radius: 16px; background: #BD9777; color: #222634; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 22px; text-decoration: none">
<span style="font-family: 'Anton', Impact, sans-serif; font-size: 27px; letter-spacing: 0.5px">BACK HOME</span>
<span style="width: 46px; height: 46px; border-radius: 23px; background: #222634; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#BD9777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</span>
</a>
<button type="button" onClick="{{closeReturned}}" style="font-family: inherit; min-height: 44px; border: none; background: none; color: #E3C4A8; font-size: 15px; font-weight: 700; cursor: pointer">Keep chatting</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"returned":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var extra = s.extra || [];
    var confirmed = !!s.confirmed;
    var returned = s.returned !== undefined ? s.returned : !!this.props.returned;
    var base = [
      { kind: 'system', text: 'You two matched. Ask a question only the owner would know, and meet somewhere public.' },
      { kind: 'them', text: 'Hi! I think I found your case in the library study area. Before I hand it over, what is on the back of it?', time: '11:52' },
      { kind: 'me', text: 'A small Oman flag sticker, and a scratch near the hinge.', time: '11:54' },
      { kind: 'them', text: 'That is the one. I am on campus until 3. Library entrance?', time: '11:55' },
      { kind: 'meet', time: '2:30 PM', when: 'Today · Library entrance' }
    ];
    var send = function (text) {
      var t = (text || '').trim();
      if (!t) return;
      self.setState({ extra: extra.concat([{ kind: 'me', text: t, time: 'Now' }]), draft: '' });
    };
    var msgs = base.concat(extra).map(function (m) {
      return Object.assign({}, m, {
        isSystem: m.kind === 'system', isThem: m.kind === 'them', isMe: m.kind === 'me', isMeet: m.kind === 'meet',
        pending: !confirmed, confirmed: confirmed,
        confirm: function () { self.setState({ confirmed: true }); }
      });
    });
    var quick = ['On my way', 'Running 5 min late', 'Thank you so much!'].map(function (l) {
      return { label: l, send: function () { send(l); } };
    });
    return {
      msgs: msgs,
      returned: returned,
      markReturned: function () { self.setState({ returned: true }); },
      closeReturned: function () { self.setState({ returned: false }); },
      quick: quick,
      draft: s.draft || '',
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      onKey: function (e) { if (e.key === 'Enter') send(s.draft); },
      onSend: function () { send(s.draft); }
    };
  }
}
</script>
</body>
</html>
